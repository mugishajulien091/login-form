<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login Form</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, sans-serif;
    }

    body{
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background:#1a001f;
    }

    .login-box{
      width:320px;
      padding:30px;
      background:#2b0033;
      border-radius:15px;
      box-shadow:0 0 20px purple;
      text-align:center;
    }

    .login-box h2{
      color:white;
      margin-bottom:20px;
    }

    .input-box{
      margin:15px 0;
    }

    .input-box input{
      width:100%;
      padding:12px;
      border:none;
      border-radius:8px;
      outline:none;
      font-size:16px;
    }

    .login-btn{
      width:100%;
      padding:12px;
      border:none;
      border-radius:8px;
      background:purple;
      color:white;
      font-size:16px;
      cursor:pointer;
      transition:0.3s;
    }

    .login-btn:hover{
      background:#b300ff;
    }

    .text{
      margin-top:15px;
      color:white;
      font-size:14px;
    }

    .text a{
      color:#d966ff;
      text-decoration:none;
    }
  </style>
</head>
<body>

  <div class="login-box">
    <h2>Login</h2>

    <form>
      <div class="input-box">
        <input type="text" placeholder="Username" required>
      </div>

      <div class="input-box">
        <input type="password" placeholder="Password" required>
      </div>

      <button type="submit" class="login-btn">
        Login
      </button>

      <div class="text">
        Don't have an account?
        <a href="#">Register</a>
      </div>
    </form>
  </div>

</body>
</html>
